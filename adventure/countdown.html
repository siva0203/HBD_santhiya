<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Surprise Is Coming ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/countdown.css">
</head>
<body>
<canvas id="three-bg" aria-hidden="true"></canvas>
<div id="particles-js" aria-hidden="true"></div>
<div id="unlocked-flash" aria-hidden="true"></div>

<main role="status" aria-live="polite">
  <p class="fairy" id="fairy" aria-hidden="true">🧚</p>
  <p class="envelope" id="envelope" aria-hidden="true">💌</p>
  <h1 id="message"></h1>
  <p class="sub" id="submessage"></p>
  <div class="countdown">
    <div class="unit"><span class="num" id="cd-days">00</span><span class="label">Days</span></div>
    <div class="unit"><span class="num" id="cd-hours">00</span><span class="label">Hours</span></div>
    <div class="unit"><span class="num" id="cd-mins">00</span><span class="label">Mins</span></div>
    <div class="unit"><span class="num" id="cd-secs">00</span><span class="label">Secs</span></div>
  </div>
  <p class="rotating-message" id="rotating-message"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script src="config/countdown-config.js"></script>
<script src="js/countdown-background.js"></script>
<script src="js/countdown-particles.js"></script>
<script src="js/countdown-app.js"></script>
</body>
</html>
